<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRITS Indonesia – Daftar Halaman</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f6;--card:#fff;--tx:#14263a;--mut:#5d6f80;--bd:#dbe3e8;
  --pri:#0e7c7b;--priT:#fff;--soft:#e2f2f1;--acc:#f2a33a;--accSoft:color-mix(in srgb,#f2a33a 18%,transparent);
  --shadow:0 6px 20px rgba(20,38,58,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b27;--card:#172636;--tx:#e8eef3;--mut:#93a5b5;--bd:#27394b;
    --pri:#3fc1bf;--priT:#06222a;--soft:#17383e;--acc:#f5b055;--accSoft:color-mix(in srgb,#f5b055 20%,transparent);
    --shadow:0 8px 24px rgba(0,0,0,.28);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b27;--card:#172636;--tx:#e8eef3;--mut:#93a5b5;--bd:#27394b;
  --pri:#3fc1bf;--priT:#06222a;--soft:#17383e;--acc:#f5b055;--accSoft:color-mix(in srgb,#f5b055 20%,transparent);
  --shadow:0 8px 24px rgba(0,0,0,.28);color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.55 Figtree,system-ui,-apple-system,sans-serif;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.015em}
.wrap{max-width:1080px;margin:0 auto;padding:32px 4px 56px}
.hero{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  padding:24px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--shadow);
  margin-bottom:22px;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo{
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  background:var(--pri);color:var(--priT);font:700 18px 'Bricolage Grotesque',sans-serif;
}
.hero h1{font-size:28px;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--mut);max-width:620px}
.top-actions{display:flex;gap:8px;align-items:center}
button,.btn{
  font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--tx);
  padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .15s,border-color .15s;
}
button:hover,.btn:hover{border-color:var(--pri);background:var(--soft)}
button:active,.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);color:var(--priT);border-color:var(--pri)}
.btn.pri:hover{filter:brightness(1.06);background:var(--pri)}
.toolbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:18px;
}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  padding:6px 13px;border-radius:99px;font-size:13.5px;font-weight:600;
  background:var(--card);border:1px solid var(--bd);color:var(--mut);
}
.pill.on{background:var(--pri);color:var(--priT);border-color:var(--pri)}
.search{position:relative;flex:1;min-width:220px;max-width:320px}
.search input{
  width:100%;font:inherit;padding:8px 12px;border-radius:10px;
  border:1px solid var(--bd);background:var(--card);color:var(--tx);
}
.search input:focus{outline:2px solid var(--acc);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);
  transition:transform .15s,border-color .15s;
}
.card:hover{transform:translateY(-2px);border-color:var(--pri)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;
  font-size:12px;font-weight:600;background:var(--soft);color:var(--pri);
}
.badge.rec{background:var(--accSoft);color:var(--tx)}
.badge.mut{background:var(--bg);color:var(--mut);border:1px solid var(--bd)}
.fname{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--mut)}
.card h2{font-size:19px;line-height:1.25}
.card p{margin:0;color:var(--mut);font-size:14px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);color:var(--mut)}
.card-foot{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.card-foot .btn{flex:1;min-width:120px}
.empty{
  grid-column:1/-1;text-align:center;padding:36px 16px;
  background:var(--card);border:1px dashed var(--bd);border-radius:14px;color:var(--mut);
}
footer{margin-top:28px;text-align:center;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <div class="brand">
        <div class="logo">B</div>
        <span>BRITS INDONESIA</span>
      </div>
      <h1>Daftar Halaman Tersedia</h1>
      <p>Pilih portal operasional tim atau tur ruang kelas 3D yang ingin dibuka.</p>
    </div>
    <div class="top-actions">
      <button type="button" id="themeBtn" aria-label="Ganti tema">🌓 Tema</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="filters" id="filters" role="tablist" aria-label="Filter kategori">
      <button type="button" class="pill on" data-cat="semua">Semua</button>
      <button type="button" class="pill" data-cat="portal">Portal &amp; Sistem</button>
      <button type="button" class="pill" data-cat="3d">Ruang 3D</button>
      <button type="button" class="pill" data-cat="arsip">Versi Sebelumnya</button>
    </div>
    <div class="search">
      <input type="search" id="q" placeholder="Cari halaman atau fitur..." aria-label="Cari halaman">
    </div>
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    <span id="count"></span>
  </footer>
</div>

<script>
const PAGES = [
  {
    title: 'BRITS Indonesia – Portal Terpadu (v3.0)',
    file: 'BRITS_Indonesia_Portal_Terpadu.html',
    cat: 'portal',
    badge: 'Terbaru · Portal Utama',
    badgeClass: 'rec',
    desc: 'Portal terpadu untuk divisi HR, Marketing, Front Office, dan Tamu. Mencakup login 2.0, pendataan tamu, pembagian kelas, jadwal, data siswa, dan alumni.',
    tags: ['HR', 'Marketing', 'Front Office', 'Tamu'],
    primary: true
  },
  {
    title: '3D Live Seat – Ruang Kelas',
    file: '3D LIVE SEAT.html',
    cat: '3d',
    badge: '3D Interaktif',
    badgeClass: '',
    desc: 'Visualisasi 3D ruang kelas untuk akun tamu dengan indikator ketersediaan kursi secara langsung (hijau = kosong, merah = terisi) serta tur kamera otomatis.',
    tags: ['Three.js', 'Live Seat', 'Tamu'],
    extra: { label: 'Buka Kelas A1', href: '3D%20LIVE%20SEAT.html?kelas=A1' }
  },
  {
    title: 'Bougenville 2.0 – Room Tour 3D',
    file: 'Bougenville 2.0.html',
    cat: '3d',
    badge: '3D Room Tour',
    badgeClass: '',
    desc: 'Tur virtual 3D interaktif ruang kelas Bougenville lengkap dengan kursi kuliah, layar TV, papan gantung, kontrol kamera bebas, dan mode tur otomatis.',
    tags: ['Three.js', 'Room Tour', 'Bougenville']
  },
  {
    title: 'Portal Marketing Brits (v2.0)',
    file: 'INDEX 2.0.html',
    cat: 'portal',
    badge: 'Portal v2.0',
    badgeClass: '',
    desc: 'Portal Marketing dan Front Office versi 2.0 dengan tambahan tab pencatatan tamu, manajemen pendaftar, jadwal, tentor, kelas, dan konsultasi.',
    tags: ['Marketing', 'Front Office', 'Tamu']
  },
  {
    title: 'BRITS Indonesia – Portal Tim (Layout Front)',
    file: 'LAYOUT FRONT.html',
    cat: 'arsip',
    badge: 'Prototipe Layout',
    badgeClass: 'mut',
    desc: 'Prototipe satu pintu masuk untuk tim HR & Presensi, Marketing, dan Front Office dengan mode demo login.',
    tags: ['Prototipe', 'HR', 'Marketing', 'FO']
  },
  {
    title: 'Portal Marketing Brits (v1.0)',
    file: 'INDEX 1.0.html',
    cat: 'arsip',
    badge: 'Arsip v1.0',
    badgeClass: 'mut',
    desc: 'Halaman index awal Portal Marketing & Front Office sebelum pembaruan fitur tamu dan portal terpadu.',
    tags: ['Marketing', 'Front Office', 'Arsip']
  }
];

const grid = document.getElementById('grid');
const qInput = document.getElementById('q');
const countEl = document.getElementById('count');
const filters = document.getElementById('filters');
let activeCat = 'semua';

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const q = qInput.value.trim().toLowerCase();
  const list = PAGES.filter(p => {
    const matchCat = activeCat === 'semua' || p.cat === activeCat;
    const hay = (p.title + ' ' + p.file + ' ' + p.desc + ' ' + p.tags.join(' ')).toLowerCase();
    return matchCat && (!q || hay.includes(q));
  });

  countEl.textContent = `Menampilkan ${list.length} dari ${PAGES.length} halaman tersedia`;

  if (!list.length) {
    grid.innerHTML = '<div class="empty">Tidak ada halaman yang cocok dengan pencarian Anda.</div>';
    return;
  }

  grid.innerHTML = list.map(p => {
    const href = encodeURI(p.file);
    return `
      <article class="card">
        <div class="card-top">
          <span class="badge ${esc(p.badgeClass)}">${esc(p.badge)}</span>
          <span class="fname">${esc(p.file)}</span>
        </div>
        <h2>${esc(p.title)}</h2>
        <p>${esc(p.desc)}</p>
        <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <div class="card-foot">
          <a class="btn ${p.primary ? 'pri' : ''}" href="${href}">Buka Halaman ↗</a>
          ${p.extra ? `<a class="btn" href="${esc(p.extra.href)}">${esc(p.extra.label)}</a>` : ''}
        </div>
      </article>
    `;
  }).join('');
}

filters.addEventListener('click', e => {
  const btn = e.target.closest('button[data-cat]');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  filters.querySelectorAll('.pill').forEach(b => b.classList.toggle('on', b === btn));
  render();
});

qInput.addEventListener('input', render);

const root = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
function syncThemeLabel() {
  const cur = root.getAttribute('data-theme');
  themeBtn.textContent = cur === 'dark' ? '☀️ Terang' : cur === 'light' ? '🌙 Gelap' : '🌓 Tema';
}
const savedTheme = localStorage.getItem('brits_dir_theme');
if (savedTheme) root.setAttribute('data-theme', savedTheme);
syncThemeLabel();

themeBtn.addEventListener('click', () => {
  const cur = root.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('brits_dir_theme', next);
  syncThemeLabel();
});

render();
</script>
</body>
</html>
