<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room Tour 3D – Ruang Kelas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<style>
:root{--bg:#dfe6ea;--pill:rgba(24,28,32,.66);--on:#fff;--acc:#f5a623;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1316;--pill:rgba(0,0,0,.62)}}
:root[data-theme="dark"]{--bg:#0f1316;--pill:rgba(0,0,0,.62)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--on);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%}
canvas{display:block;width:100%;height:100%;cursor:grab}
.ui{position:absolute;pointer-events:none;left:0;right:0;padding:0 12px}
.ui>*{pointer-events:auto}
#top{top:10px}
#cap{display:inline-block;max-width:min(420px,100%);background:var(--pill);backdrop-filter:blur(8px);border-radius:14px;padding:10px 14px}
#cap b{display:block;font-size:16px;margin-bottom:2px}
#cap span{font-size:13px;line-height:1.4;opacity:.9}
#bot{bottom:12px;display:flex;flex-direction:column;gap:10px}
#pad{align-self:flex-end;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
#pad button{font-size:18px}
#pad .u{grid-column:2}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
button{font:inherit;color:var(--on);background:var(--pill);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:9px 14px;white-space:nowrap;cursor:pointer}
#pad button{padding:0;border-radius:14px}
button.on,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#play{background:var(--acc);color:#2a1a00;border:0;font-weight:600}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.34))}
#khead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px;font-size:12px}
#live{font-size:11px;white-space:nowrap}#live[data-s=live]{color:#6ff0a4}#live[data-s=demo]{color:#ffd166}#live[data-s=off]{color:#ff8a8a}
#ksel{width:100%;margin:0 0 8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px;font:inherit;font-size:12px}#ksel option{color:#000}
#hint{font-size:12px;opacity:.85;margin-top:6px;text-shadow:0 1px 3px #000}
#row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
#row>*{pointer-events:auto}
#stat{background:var(--pill);backdrop-filter:blur(8px);border-radius:14px;padding:10px 12px;border:2px solid #2ee67a;min-width:150px}
#stat.ok{animation:pg 2s ease-in-out infinite}
#stat.full{border-color:#ff4d4d;animation:pl 1.1s ease-in-out infinite}
#cnt{font-size:26px;font-weight:700;line-height:1}
#msg{font-size:13px;margin:3px 0 8px;color:#6ff0a4}
#stat.full #msg{color:#ff8a8a}
#acts{display:flex;gap:6px}
#acts button{padding:5px 9px;font-size:12px;border-radius:12px}
#stat small{display:block;font-size:11px;opacity:.75;margin-top:6px}
@keyframes pg{50%{box-shadow:0 0 0 5px rgba(46,230,122,.22)}}
@keyframes pl{50%{box-shadow:0 0 0 7px rgba(255,77,77,.3)}}
</style>
</head>
<body>
<div id="app">
  <div id="vig"></div>
  <div class="ui" id="top"><div id="cap"><b id="t">Ruang kelas</b><span id="d">Geser layar untuk melihat sekeliling.</span></div><div id="hint">Geser: lihat sekeliling · WASD / tombol panah: jalan</div></div>
  <div class="ui" id="bot">
    <div id="row"><div id="stat"><div id="khead"><b id="kname"></b><span id="live"></span></div><select id="ksel" hidden></select><div id="cnt">0/20</div><div id="msg"></div><div id="acts"><button data-a="rand">Isi acak</button><button data-a="full">Penuh</button><button data-a="clr">Kosong</button></div><small id="hs">Ketuk kursi untuk ubah status</small></div><div id="pad"><button class="u" data-k="f" aria-label="Maju">▲</button><button data-k="l" aria-label="Geser kiri">◀</button><button data-k="b" aria-label="Mundur">▼</button><button data-k="r" aria-label="Geser kanan">▶</button></div></div>
    <div id="chips"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const app=$('app'),R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.shadowMap.autoUpdate=false;
app.prepend(R.domElement);
const C=c=>new THREE.Color(c).convertSRGBToLinear();
const S=new THREE.Scene();S.background=C(0x8e9aa0);
const cam=new THREE.PerspectiveCamera(70,1,.05,50);cam.rotation.order='YXZ';
function rs(){const w=app.clientWidth,h=app.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?80:68;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

const W=8,D=7,H=3.6,WH=1.4,PI=Math.PI;
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:C(c)},o));
const P=(c,s,o)=>new THREE.MeshPhongMaterial(Object.assign({color:C(c),shininess:s,specular:0x2a2a2a},o));
function wood(base,dark,rx,ry){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,256,256);
  for(let i=0;i<90;i++){x.strokeStyle=dark;x.globalAlpha=Math.random()*.2;x.lineWidth=Math.random()*3+.5;const p=Math.random()*256;x.beginPath();x.moveTo(p,0);x.bezierCurveTo(p+Math.random()*10-5,80,p+Math.random()*10-5,170,p+Math.random()*8-4,256);x.stroke()}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const mk=(g,m,x=0,y=0,z=0,p=S)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const bx=(w,h,d,m,x,y,z,p)=>mk(new THREE.BoxGeometry(w,h,d),m,x,y,z,p);
const cyl=(r,h,n=10)=>new THREE.CylinderGeometry(r,r,h,n);
function rr(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
const ext=(s,t)=>{const g=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false,curveSegments:8});g.translate(0,0,-t/2);return g};
const slab=(w,d,t,r)=>{const g=ext(rr(w,d,r),t);g.rotateX(-PI/2);return g};
const panel=(w,h,t,r)=>ext(rr(w,h,r),t);

// materials
const wallM=M(0xd3dcdf),whiteM=M(0xf4f4f2),blk=P(0x16161a,40),brn=M(0x4a2523),cream=M(0xe9e4c8),blue=M(0x2a4fb0),paper=M(0xffffff);
const metal=P(0xb5b5b0,70);
const chM=P(0xffffff,18,{map:wood('#e3a857','#9a6a28',1,1)});
const doorM=M(0xffffff,{map:wood('#dcc39b','#8a6a3c',1,1)});

// floor + ceiling
const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),P(0xffffff,28,{map:wood('#4b2c22','#1a0d0a',4,3.5)}));fl.rotation.x=-PI/2;fl.receiveShadow=true;S.add(fl);
const ce=new THREE.Mesh(new THREE.PlaneGeometry(W,D),M(0xf2f4f5));ce.rotation.x=PI/2;ce.position.y=H;S.add(ce);

// walls: local x = along wall, local z = into the room
function wall(len,x,z,ry){const g=new THREE.Group();
  const up=new THREE.Mesh(new THREE.PlaneGeometry(len,H-WH),wallM);up.position.y=WH+(H-WH)/2;
  const lo=new THREE.Mesh(new THREE.PlaneGeometry(len,WH),M(0xffffff,{map:wood('#d6bc92','#8a6a3c',len/1.4,1)}));lo.position.set(0,WH/2,.01);
  up.receiveShadow=lo.receiveShadow=true;g.add(up,lo);
  bx(len,.04,.03,M(0xb89b6c),0,WH,.02,g);bx(len,.09,.025,M(0x5a3a22),0,.045,.0125,g);
  g.position.set(x,0,z);g.rotation.y=ry;S.add(g);return g}
const wF=wall(W,0,-D/2,0),wB=wall(W,0,D/2,PI),wL=wall(D,-W/2,0,PI/2),wR=wall(D,W/2,0,-PI/2);

// cabinets (4 modules per wall)
const cabG=new THREE.BoxGeometry(1.62,.72,.38),doorG=panel(.77,.66,.02,.012),knobG=cyl(.017,.03,12);knobG.rotateX(PI/2);
function cabinets(w){for(let i=0;i<4;i++){const g=new THREE.Group();g.position.set(-2.4+i*1.6,2.55,.19);
  mk(cabG,whiteM,0,0,0,g);
  for(const s of[-1,1]){mk(doorG,doorM,s*.39,0,.2,g);mk(knobG,metal,s*.06,-.22,.232,g)}
  w.add(g)}}
cabinets(wF);cabinets(wB);

// window on left wall
(function(){const g=new THREE.Group();g.position.set(-.5,2.25,0);
  bx(2.3,1.75,.1,whiteM,0,0,.05,g);bx(2.05,1.5,.02,new THREE.MeshBasicMaterial({color:C(0x0a0f13)}),0,0,.11,g);
  bx(.06,1.5,.04,whiteM,0,0,.13,g);bx(2.4,.06,.2,whiteM,0,-.9,.1,g);wL.add(g)})();

// double door on right wall
(function(){const g=new THREE.Group();g.position.set(-2.2,0,0);
  bx(2.05,2.5,.07,whiteM,0,1.25,.035,g);
  const lg=panel(.92,2.36,.04,.02),ig=panel(.62,1.7,.02,.03),rg=new THREE.TorusGeometry(.3,.015,8,40);
  for(const s of[-1,1]){const l=new THREE.Group();l.position.set(s*.47,1.2,.09);
    mk(lg,whiteM,0,0,0,l);mk(ig,M(0xeeeeec),0,.05,.025,l);mk(rg,whiteM,0,0,.04,l);
    bx(.12,.03,.05,metal,-s*.36,-.05,.05,l);g.add(l)}
  wR.add(g)})();

// TV on mobile stand
(function(){const g=new THREE.Group();g.position.set(-.3,0,0);
  mk(panel(2.0,1.15,.06,.02),P(0x08090b,140),0,1.55,-3.38,g);
  bx(.07,1.2,.06,blk,0,.7,-3.33,g);bx(.9,.04,.55,blk,0,.08,-3.1,g);bx(.7,.03,.3,blk,0,.6,-3.25,g);
  for(const a of[-1,1])for(const b of[-1,1])mk(cyl(.035,.07,10),blk,a*.38,.035,-3.1+b*.22,g);
  bx(.3,.03,.2,blue,.1,.6+.03,-3.22,g);S.add(g)})();

// student chairs (shared geometry, every part touches its neighbour)
const seatG=slab(.44,.42,.035,.06),backG=panel(.44,.42,.03,.07),legG=cyl(.013,.45),legTG=cyl(.013,.8),
  railG=cyl(.012,.42),postG=cyl(.012,.26),tabG=slab(.54,.38,.03,.08),extG=slab(.2,.24,.03,.05),bookG=new THREE.BoxGeometry(.3,.03,.22);
railG.rotateX(PI/2);
function chair(x,z,fold,ry){const g=new THREE.Group();
  mk(seatG,chM,0,.46,0,g);mk(backG,chM,0,.69,.205,g);
  for(const a of[-1,1]){mk(legG,blk,a*.2,.225,-.18,g);mk(legTG,blk,a*.2,.4,.185,g)}
  mk(railG,blk,.23,.7,-.03,g);mk(postG,blk,.23,.57,.12,g);mk(postG,blk,.23,.57,-.2,g);
  if(fold){const t=mk(tabG,brn,.25,.9,-.02,g);t.rotation.z=1.5}
  else{mk(tabG,chM,0,.72,-.32,g);mk(extG,chM,.24,.72,-.12,g);
    if(Math.random()<.45){const b=mk(bookG,blue,0,.75,-.32,g);b.rotation.y=Math.random()*.5-.25;
      const c=bx(.2,.002,.12,paper,0,.766,-.32,g);c.rotation.y=b.rotation.y}}
  g.position.set(x,0,z);g.rotation.y=ry;S.add(g)}
// ===== 20 kursi + penanda status (hijau = kosong, merah = terisi) =====
let over=0;const N=20,GC=C(0x2ee67a),RC=C(0xff4d4d),seats=[],hits=[];
const tG=cyl(.15,.45,14),hG=new THREE.SphereGeometry(.11,16,12),thG=new THREE.BoxGeometry(.12,.1,.34),shG=cyl(.05,.46,10),ftG=new THREE.BoxGeometry(.1,.05,.18),uaG=new THREE.BoxGeometry(.07,.22,.07),faG=new THREE.BoxGeometry(.07,.07,.3),
 ringG=new THREE.RingGeometry(.3,.38,40).rotateX(-PI/2),beamG=new THREE.CylinderGeometry(.42,.42,1.5,28,1,true).translate(0,.75,0);
const skin=M(0xe0b090),hair=M(0x2a1a12),pants=M(0x26303d),shoe=M(0xf2f2f2),shirts=[0x3b82c4,0xd9534f,0x4caf7a,0xf0b429,0x8e6bbf,0xeeeeee,0x2b3a55];
function person(){const g=new THREE.Group(),sm=M(shirts[Math.random()*shirts.length|0]);
  mk(tG,sm,0,.78,.02,g);mk(hG,skin,0,1.1,0,g);mk(hG,hair,0,1.13,.02,g).scale.set(1.06,.9,1.08);
  for(const s of[-1,1]){mk(uaG,sm,s*.18,.86,.02,g);mk(faG,skin,s*.18,.772,-.14,g);mk(thG,pants,s*.08,.53,-.04,g);mk(shG,pants,s*.08,.26,-.2,g);mk(ftG,shoe,s*.08,.025,-.23,g)}
  return g}
for(let r=0;r<4;r++)for(let c=0;c<5;c++){const x=-2.9+c*1.25+(r%2)*.1,z=-.6+r*1.1,ry=(Math.random()-.5)*.1;chair(x,z,false,ry);
  const grp=new THREE.Group();grp.position.set(x,0,z);grp.rotation.y=ry;S.add(grp);
  const fig=person();fig.visible=false;grp.add(fig);
  const ring=new THREE.Mesh(ringG,new THREE.MeshBasicMaterial({color:GC,transparent:true,opacity:.9,depthWrite:false}));ring.position.y=.015;grp.add(ring);
  const beam=new THREE.Mesh(beamG,new THREE.MeshBasicMaterial({color:GC,transparent:true,opacity:.18,side:2,depthWrite:false,blending:THREE.AdditiveBlending}));grp.add(beam);
  const hit=new THREE.Mesh(new THREE.BoxGeometry(.9,1.5,.9),new THREE.MeshBasicMaterial({visible:false}));hit.position.y=.75;hit.userData.i=seats.length;grp.add(hit);hits.push(hit);
  seats.push({fig,ring,beam,k:0,occ:false,i:seats.length})}
function setStat(){const n=seats.filter(s=>s.occ).length,full=n==N;$('cnt').textContent=n+'/'+N;$('msg').textContent=full?'Kelas penuh'+(over?' · '+over+' antre':''):'Sisa '+(N-n)+' kursi';$('stat').className=full?'full':'ok'}
function animSeats(t,dt){const full=seats.every(s=>s.occ),a=1-Math.exp(-dt*7);let mv=false;
  for(const s of seats){const d=(s.occ?1:0)-s.k;if(Math.abs(d)>.002){s.k+=d*a;mv=true}else s.k=s.occ?1:0;
    const k=s.k,w=Math.sin(t*(full?4:2.5)-s.i*.6);
    s.fig.visible=k>.03;s.fig.scale.set(k,k*(1+.12*Math.sin(k*PI)),k);
    s.ring.material.color.copy(GC).lerp(RC,k);s.ring.scale.setScalar(1+.07*w*(full?1.5:1));s.ring.material.opacity=.7+.25*w;
    s.beam.visible=k<.97;s.beam.material.opacity=(1-k)*(.14+.07*w)}
  if(mv)R.shadowMap.needsUpdate=true}
const pre=new Set();while(pre.size<13)pre.add(Math.random()*N|0);
seats.forEach(s=>{s.occ=pre.has(s.i);s.k=s.occ?1:0});setStat();
document.querySelectorAll('#acts button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;seats.forEach(s=>s.occ=a=='full'?true:a=='clr'?false:Math.random()<.6);if(a=='rand'&&seats.every(s=>s.occ))seats[0].occ=false;setStat()});
// ===== INTEGRASI REALTIME: isi bagian LIVE ini dengan endpoint milik sistem pendaftaran kamu =====
const LIVE={
  api:'',        // GET -> JSON (format di bawah). Contoh: 'https://sekolahmu.id/api/kelas'. Kosong = mode demo
  ws:'',         // opsional, 'wss://sekolahmu.id/ws/kelas': server mendorong JSON yang sama setiap ada perubahan
  poll:5000,     // interval polling (ms) bila tanpa WebSocket
  headers:{},    // mis. {Authorization:'Bearer TOKEN'} (jangan taruh rahasia penting di sisi klien)
  classId:new URLSearchParams(location.search).get('kelas')||'', // buka dengan ?kelas=A1 untuk kelas tertentu
  manual:false   // true = kursi bisa diketuk manual (untuk uji coba)
};
/* Format JSON yang dibaca (satu kelas, atau banyak kelas dalam "kelas"):
   {"kelas":[{"id":"A1","nama":"Kelas A1","terdaftar":13,"kursi":[1,2,5]}]}
   - "terdaftar": jumlah pendaftar. Lebih dari 20 dihitung sebagai antrean.
   - "kursi" (opsional): nomor kursi 1-20 yang terisi. Bila tidak ada, kursi terisi berurutan dari depan. */
let classes=[],curK=null;const ksel=$('ksel'),lv=$('live');
function setLive(x){lv.textContent={live:'● Live',demo:'● Mode demo',off:'● Terputus'}[x];lv.dataset.s=x}
function applyClass(k){if(!k)return;curK=k;const t=Math.max(0,k.terdaftar|0),occ=new Set(Array.isArray(k.kursi)?k.kursi.map(v=>v-1):[...Array(Math.min(N,t)).keys()]);
  seats.forEach(s=>s.occ=occ.has(s.i));over=Math.max(0,t-N);$('kname').textContent=k.nama||k.id||'';setStat()}
function ingest(d){classes=Array.isArray(d)?d:(d.kelas||[d]);if(!classes.length)return;
  if(ksel.options.length!=classes.length){ksel.innerHTML='';classes.forEach(k=>ksel.add(new Option(k.nama||k.id,k.id)))}
  ksel.hidden=classes.length<2;
  const id=curK&&classes.some(k=>k.id==curK.id)?curK.id:(LIVE.classId||classes[0].id);
  ksel.value=id;applyClass(classes.find(k=>k.id==id)||classes[0])}
ksel.onchange=()=>applyClass(classes.find(k=>k.id==ksel.value));
if(!LIVE.manual){$('acts').hidden=true;$('hs').hidden=true}
function startLive(){
  if(!LIVE.api&&!LIVE.ws){setLive('demo');const dm=[{id:'A1',nama:'Kelas A1',terdaftar:13},{id:'A2',nama:'Kelas A2',terdaftar:18},{id:'B1',nama:'Kelas B1',terdaftar:19}];
    ingest(dm);setInterval(()=>{const k=dm[Math.random()*dm.length|0];k.terdaftar=k.terdaftar>=22?3+(Math.random()*5|0):k.terdaftar+1;ingest(dm)},3500);return}
  if(LIVE.ws){const conn=()=>{const w=new WebSocket(LIVE.ws);w.onopen=()=>setLive('live');w.onmessage=e=>{try{ingest(JSON.parse(e.data))}catch(_){}};w.onclose=()=>{setLive('off');setTimeout(conn,3000)}};conn()}
  if(LIVE.api){let wait=LIVE.poll;const tick=async()=>{if(!document.hidden){try{
      const r=await fetch(LIVE.api+(LIVE.classId?'?kelas='+encodeURIComponent(LIVE.classId):''),{headers:LIVE.headers,cache:'no-store'});
      if(!r.ok)throw 0;ingest(await r.json());if(!LIVE.ws)setLive('live');wait=LIVE.ws?30000:LIVE.poll}
    catch(_){if(!LIVE.ws)setLive('off');wait=Math.min(wait*2,30000)}}setTimeout(tick,wait)};tick()}}
startLive();
const rc=new THREE.Raycaster(),mv2=new THREE.Vector2();
function pick(e){const b=R.domElement.getBoundingClientRect();mv2.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);rc.setFromCamera(mv2,cam);
  const h=LIVE.manual?rc.intersectObjects(hits)[0]:null;if(h){const s=seats[h.object.userData.i];s.occ=!s.occ;setStat()}}

// teacher desk + chair
(function(){const g=new THREE.Group();g.position.set(-3.1,0,-2.5);
  mk(slab(1.1,.55,.04,.02),cream,0,.75,0,g);bx(.4,.73,.5,cream,.33,.365,0,g);
  for(const a of[-1,1])for(const b of[-1,1])mk(cyl(.015,.73),metal,a*.52,.365,b*.24,g);
  mk(seatG,cream,0,.45,.85,g);mk(backG,cream,0,.68,1.05,g);
  for(const a of[-1,1]){mk(cyl(.013,.43),metal,a*.17,.215,.7,g);mk(cyl(.013,.78),metal,a*.17,.39,1.03,g)}
  S.add(g)})();

// hanging stars + sachets (hang from the underside of the cabinets)
function star(R,r){const s=new THREE.Shape();for(let i=0;i<10;i++){const a=PI/2+i*PI/5,q=i%2?r:R,x=Math.cos(a)*q,y=Math.sin(a)*q;i?s.lineTo(x,y):s.moveTo(x,y)}s.closePath();return s}
const hang=[];
function hanger(x,z,L,col,kind,face){const p=new THREE.Group();p.position.set(x,2.19,z);p.rotation.y=face||0;
  bx(.004,L,.004,paper,0,-L/2,0,p).castShadow=false;
  const it=new THREE.Group();
  if(kind){it.position.y=-L-.1;const k=new THREE.Mesh(new THREE.PlaneGeometry(.2,.22),new THREE.MeshBasicMaterial({color:C(col),side:2}));k.castShadow=true;it.add(k)}
  else{it.position.y=-L-.24;const wm=new THREE.MeshBasicMaterial({color:0xffffff,side:2}),cm=new THREE.MeshBasicMaterial({color:C(col),side:2});
    const w=new THREE.Mesh(new THREE.ShapeGeometry(star(.27,.15)),wm);w.castShadow=true;it.add(w);
    const c=new THREE.Mesh(new THREE.ShapeGeometry(star(.22,.12)),cm);c.position.z=.003;it.add(c)}
  p.add(it);S.add(p);hang.push({p,ph:Math.random()*6})}
const PU=0x8a4fb8,OR=0xf5a623,BL=0x2a8fb8;
hanger(-2.4,-3.22,.7,PU);hanger(.5,-3.22,.95,OR);hanger(2.4,-3.22,.5,PU);hanger(1.6,-3.22,.35,0xeeeeee,1);
hanger(-2,3.22,.8,BL,0,PI);hanger(2.2,3.22,.9,OR,0,PI);hanger(.2,3.22,.4,0x7fd0a0,1,PI);

// lights: 4 ceiling spots with soft shadows (rendered once, the scene is static)
S.add(new THREE.HemisphereLight(C(0xeef3f6),C(0x6e5a48),.85));
for(const[x,z]of[[-2,-1.5],[2,-1.5],[-2,2],[2,2]]){const l=new THREE.SpotLight(C(0xfff1de),.65,11,1.25,.7,1);
  l.position.set(x,3.4,z);l.target.position.set(x,0,z);S.add(l,l.target);l.castShadow=true;
  l.shadow.mapSize.set(1024,1024);l.shadow.bias=-.0006;l.shadow.normalBias=.02;l.shadow.camera.near=.3;l.shadow.camera.far=9;
  bx(1.2,.03,.15,new THREE.MeshBasicMaterial({color:0xffffff}),x,H-.02,z).castShadow=false}
const wl=new THREE.PointLight(C(0xa8c8ff),.25,6);wl.position.set(-3.4,2.2,.5);S.add(wl);
R.shadowMap.needsUpdate=true;

// camera state + tour
const st=[
 {n:'Pintu masuk',d:'Pintu ganda putih di sisi kanan. Dinding bawah berpanel kayu, lantai kayu gelap.',p:[3.3,1.6,-2.2],l:[-2,1.2,.5]},
 {n:'Area belajar',d:'Kursi kuliah dengan meja lipat, tersusun dalam empat baris. Buku UTBK tergeletak di beberapa meja.',p:[-3.3,2.1,-2.9],l:[1.5,.7,1.8]},
 {n:'Denah kursi',d:'Tampak dari atas: 20 kursi. Lingkaran hijau berarti kosong, merah berarti terisi.',p:[0,3.2,-2.9],l:[0,0,1.2]},
 {n:'Layar TV',d:'TV besar di atas standar beroda, diapit bintang gantung ungu dan oranye.',p:[.6,1.6,1.6],l:[-.3,1.5,-3.4]},
 {n:'Lemari gantung depan',d:'Empat modul lemari putih berpintu kayu terang, lengkap dengan gagang bulat.',p:[-.6,1.5,-1.2],l:[.2,2.5,-3.5]},
 {n:'Lemari gantung belakang',d:'Deret lemari yang sama di dinding belakang, dengan bintang biru dan oranye.',p:[.3,1.6,.3],l:[.3,2.5,3.5]},
 {n:'Jendela',d:'Jendela berbingkai putih di dinding kiri. Tinggi plafon sekitar 3,6 m.',p:[2.4,1.6,.9],l:[-4,1.9,-.3]}];
st.forEach(s=>{const dx=s.l[0]-s.p[0],dy=s.l[1]-s.p[1],dz=s.l[2]-s.p[2];s.y=Math.atan2(-dx,-dz);s.pt=Math.atan2(dy,Math.hypot(dx,dz))});
let pos=new THREE.Vector3(...st[0].p),yaw=st[0].y,pit=st[0].pt,ty=yaw,tp=pit,tw=null,auto=false,dwell=0,cur=0;
const vel=new THREE.Vector2();
const chips=$('chips');
const play=document.createElement('button');play.id='play';play.textContent='▶ Tur otomatis';chips.append(play);
st.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.onclick=()=>{stopAuto();go(i)};chips.append(b)});
function mark(i){[...chips.children].forEach((b,j)=>b.classList.toggle('on',j==i+1))}
function go(i){cur=i;const s=st[i];let dy=s.y-yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));
  tw={t:0,dur:3.4,p0:pos.clone(),y0:yaw,pt0:pit,p1:new THREE.Vector3(...s.p),dy,pt1:s.pt};
  $('t').textContent=s.n;$('d').textContent=s.d;mark(i)}
function stopAuto(){auto=false;play.textContent='▶ Tur otomatis'}
play.onclick=()=>{if(auto){stopAuto();return}auto=true;play.textContent='❚❚ Hentikan tur';go(0)};

// input
let drag=null;const cv=R.domElement,keys={};
const take=()=>{stopAuto();tw=null;ty=yaw;tp=pit};
let p0;cv.addEventListener('pointerdown',e=>{p0={x:e.clientX,y:e.clientY};drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);take()});
cv.addEventListener('pointermove',e=>{if(!drag)return;ty+=(e.clientX-drag.x)*.005;tp=Math.max(-1.2,Math.min(1.2,tp+(e.clientY-drag.y)*.005));drag={x:e.clientX,y:e.clientY}});
const up=e=>{if(drag&&p0&&e.type=='pointerup'&&Math.hypot(e.clientX-p0.x,e.clientY-p0.y)<6)pick(e);drag=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const km={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
addEventListener('keydown',e=>{if(km[e.code]){keys[km[e.code]]=1;take()}});
addEventListener('keyup',e=>{if(km[e.code])keys[km[e.code]]=0});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;take()});
  for(const ev of['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys[k]=0)});

// loop
const clk=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
  if(tw){tw.t=Math.min(1,tw.t+dt/tw.dur);const k=tw.t,e=k*k*k*(k*(k*6-15)+10);
    pos.lerpVectors(tw.p0,tw.p1,e);yaw=tw.y0+tw.dy*e;pit=tw.pt0+(tw.pt1-tw.pt0)*e;ty=yaw;tp=pit;
    if(tw.t>=1){tw=null;dwell=4}}
  else{const k=1-Math.exp(-dt*16);yaw+=(ty-yaw)*k;pit+=(tp-pit)*k;if(auto){dwell-=dt;if(dwell<=0)go((cur+1)%st.length)}}
  const f=(keys.f?1:0)-(keys.b?1:0),s=(keys.r?1:0)-(keys.l?1:0),a=1-Math.exp(-dt*9);
  vel.x+=((-Math.sin(yaw)*f+Math.cos(yaw)*s)*2.2-vel.x)*a;vel.y+=((-Math.cos(yaw)*f-Math.sin(yaw)*s)*2.2-vel.y)*a;
  if(!tw){pos.x=Math.max(-W/2+.4,Math.min(W/2-.4,pos.x+vel.x*dt));pos.z=Math.max(-D/2+.4,Math.min(D/2-.4,pos.z+vel.y*dt))}
  hang.forEach(h=>{h.p.rotation.z=Math.sin(t*.9+h.ph)*.03});animSeats(t,dt);
  cam.position.copy(pos);cam.rotation.set(pit,yaw,0);R.render(S,cam)})();
mark(0);
</script>
</body>
</html>
